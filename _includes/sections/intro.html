<section id="intro" class="intro">
  <img class="intro__photo reveal" style="--d: 0" src="/img/profile.jpg" alt="Jeffrey Ding He">
  <div class="intro__text">
    <p class="intro__eyebrow reveal" style="--d: 1">{{ site.tagline }}</p>
    <p class="intro__credentials reveal" style="--d: 2">{{ site.credentials }}</p>
    <h1 class="intro__statement reveal" style="--d: 3">{{ site.intro }}</h1>
  </div>
</section>
