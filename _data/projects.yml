- name: Harvard Open Data Project
  subtitle: Harvard's first open data catalog
  img: img/hodp.png
  alt: Harvard Open Data Project logo
  dates: Jan 2017 – May 2020
  links:
    - label: Website
      url: "https://www.hudp.org/"
    - label: GitHub
      url: "https://github.com/Harvard-Open-Data-Project/harvard-open-data-project.github.io"
    - label: Media
      url: "https://www.thecrimson.com/article/2018/11/15/2018-open-data-project-uc/"
  description: |
    Co-founded the HODP student organization around an existing project, served as President. As a group, our mission is to use public Harvard data to increase transparency and tackle issues on campus, and it still runs <a target="_blank" href="https://www.hudp.org/">today</a>. Used data science to dig into: <a target="_blank" href="https://medium.com/harvard-open-data-project/literally-nobody-voted-in-the-quincy-midterm-elections-409bf19a59cf">student election turnout</a>, <a target="_blank" href="https://medium.com/harvard-open-data-project/gender-disparity-in-harvard-faculty-b253ae949a56">faculty gender disparity</a>, <a target="_blank" href="https://medium.com/harvard-open-data-project/from-ec-to-tech-how-harvard-students-are-changing-concentrations-b748b55ed35b">concentration trends</a>.

- name: Datamatch
  subtitle: Matchmaking service for ~4,000 students a year
  img: img/datamatch.png
  alt: Datamatch logo
  dates: Sep 2016 – May 2018
  links:
