      url: "https://datamatch.me/"
    - label: Media
      url: "https://www.thecrimson.com/article/2019/2/15/thousands-seek-datamatch-food/"
  description: |
    A Valentine's Day tradition pairing thousands of Harvard students via survey, with mutual matches getting free meals from local Cambridge businesses. Built with Ruby on Rails and React. As web lead, I ran the team that designed the credits and archives pages.

