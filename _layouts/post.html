---
layout: default
---
<article class="post">
  <div class="post__header">
    <a href="/blog/" class="post__back">&larr; Blog</a>
    <h1>{{ page.title }}</h1>
    <p class="post__meta">
      {{ page.date | date: "%B %-d, %Y" }}
      {% for tag in page.tags %}<a class="tag-chip" href="/blog/#{{ tag }}">{{ tag }}</a>{% endfor %}
    </p>
  </div>
  <div class="post__content">
    {{ content }}
  </div>
</article>
